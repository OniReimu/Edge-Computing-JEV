name: Paper website

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_pages.py"
      - "experiments/**/results/cells.csv"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_pages.py"
      - "experiments/**/results/cells.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate site and displayed measurements
        run: python3 scripts/check_pages.py
      - name: Check JavaScript syntax
        run: |
          node --check docs/script.js
          node --check docs/extended.js

  deploy:
    if: github.repository == 'OniReimu/Edge-Computing-JEV' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: paper-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
